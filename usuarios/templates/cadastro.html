{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Biblioteca</title>

<link rel="stylesheet" href="{% static 'cadastro.css' %}">
</head>
<body>
    <main class="container">
        <div class="card">
<h1 class="logo">BIBLIOTECA<span style="margin-left: 15px;">BF</span></h1>
            <h2>Criar conta</h2>

            <form method="POST" action="{% url 'cadastro' %}">
                {% csrf_token %}

                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <div class="divider">
                <span>ou</span>
            </div>

            <p class="login-link">
                Já possui uma conta? <a href="{% url 'cadastro' %}">Entrar</a>
            </p>
        </div>
    </main>
</body>
</html>
